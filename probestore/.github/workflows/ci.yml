name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy app

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: probestore
          POSTGRES_PASSWORD: probestore
          POSTGRES_DB: probestore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U probestore"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PROBESTORE_DATABASE_URL: postgresql+asyncpg://probestore:probestore@localhost:5432/probestore
      PROBESTORE_API_TOKEN: test-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: migrations apply cleanly from scratch
        run: alembic upgrade head
      - name: migrations are reversible
        run: alembic downgrade base
      - run: pytest -q
